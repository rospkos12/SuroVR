<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>SuroVR · WebXR toybox</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0d1a; color: #eee; font: 15px/1.4 system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    /* Full-screen overlay (also the AR dom-overlay root). Only the panes take input. */
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
               padding: 12px; box-sizing: border-box; pointer-events: none; }
    .pane { pointer-events: auto; align-self: center; text-align: center; background: rgba(13, 13, 26, 0.6);
            border-radius: 20px; padding: 8px 14px; backdrop-filter: blur(4px); }
    h1 { margin: 0; font-size: 20px; }
    button { font: inherit; font-weight: 600; padding: 10px 22px; margin: 4px; border: 0; border-radius: 999px;
             background: #4a8cff; color: #fff; cursor: pointer; }
    button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    #status { margin: 4px 0 0; opacity: 0.85; }
    #status.error { opacity: 1; color: #ffb3ad; font-weight: 600; }
    .hint { font-size: 13px; opacity: 0.6; }

    /* Toy picker: big, friendly, thumb-sized buttons. */
    #picker { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 8px; }
    .pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            min-width: 84px; min-height: 84px; margin: 0; padding: 6px 10px; border-radius: 22px;
            background: #fff; color: #223; font-size: 17px; border: 4px solid transparent;
            transition: transform 0.1s, border-color 0.1s; }
    .pick .emoji { font-size: 38px; line-height: 1; }
    .pick.selected { border-color: #ffc928; background: #fff4c2; transform: scale(1.08); }
    .tools { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .tools button { margin: 0; padding: 8px 16px; font-size: 16px; }
    #clear:not(:disabled) { background: #e0524a; }

    /* Edit row: appears above the toys while a placed toy is selected. */
    #edit { display: none; flex-basis: 100%; justify-content: center; flex-wrap: wrap; gap: 8px; }
    #picker.editing #edit { display: flex; }
    #edit button { margin: 0; padding: 12px 18px; font-size: 18px; border-radius: 18px; background: #ffc928; color: #223; }
    #edit button:disabled { background: #776; color: #ccc; }
    #edit [data-act="delete"] { background: #e0524a; color: #fff; }
    #edit [data-act="done"] { background: #39b26b; color: #fff; }

    /* In AR the overlay itself takes touches (tap, drag, pinch); see interact.js. */
    body.in-ar #overlay { pointer-events: auto; touch-action: none; }

    /* In AR keep the screen clear: no title or desktop hint. In VR the page is hidden anyway. */
    body.in-ar h1, body.in-xr .hint { display: none; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Also used as the AR dom-overlay root, so these panes stay tappable in AR. -->
  <div id="overlay">
    <div class="pane" id="top">
      <h1>SuroVR</h1>
      <div class="hint">Pick a toy, tap the floor to drop it. Tap a toy to move or resize it. Drag empty space to look around.</div>
      <button id="enter-vr" disabled>Enter VR</button>
      <button id="enter-ar" disabled>Enter AR</button>
      <p id="status">Checking WebXR support…</p>
    </div>

    <!-- Toy, Undo and Clear buttons are built by js/main.js from js/models.js. -->
    <div class="pane" id="picker" aria-label="Pick a toy"></div>
  </div>

  <noscript>This demo needs JavaScript (ES modules).</noscript>
  <!-- Cache-busting: GitHub Pages lets browsers cache files for 10 minutes, so
       after an update a browser could mix new and old modules. Bump "v" here
       (in every place) whenever any JS file changes. Browsers without
       import maps simply ignore this and load the plain URLs. -->
  <script type="importmap">
  {
    "imports": {
      "./js/mat4.js": "./js/mat4.js?v=4",
      "./js/gl.js": "./js/gl.js?v=4",
      "./js/geometry.js": "./js/geometry.js?v=4",
      "./js/models.js": "./js/models.js?v=4",
      "./js/scene.js": "./js/scene.js?v=4",
      "./js/xr.js": "./js/xr.js?v=4",
      "./js/interact.js": "./js/interact.js?v=4"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=4"></script>
</body>
</html>
